<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minhas Tarefas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
      </div>
      Minhas Tarefas
    </div>
    <div class="header-right" style="display: flex; gap: 8px; align-items: center;">
      <button id="admin-btn" class="btn btn-ghost" onclick="app.showAdminSection()" style="display: none; padding: 4px 10px; font-size: 11px;">Admin Panel</button>
      <span class="date-badge" id="header-date"></span>
    </div>
  </div>
</header>

<main>

  <section id="auth-section" class="add-form">
    <h3>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      Acesso ao Sistema
    </h3>
    <div class="form-row">
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="auth-email" placeholder="seu@email.com" />
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Senha</label>
        <input type="password" id="auth-password" placeholder="******" />
      </div>
    </div>
    <div class="form-actions" style="justify-content: space-between; align-items: center; margin-top: 16px;">
      <span style="font-size: 12px; color: var(--text-muted);">Não tem conta? <a href="#" id="toggle-auth-mode" onclick="app.toggleAuthMode()" style="color: var(--accent);">Registre-se</a></span>
      <div>
        <button class="btn btn-primary" id="btn-login" onclick="app.authenticate()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Entrar
        </button>
      </div>
    </div>
  </section>

  <section id="tasks-section" style="display: none;">
    <div class="day-header" style="display: flex; justify-content: space-between; align-items: flex-end;">
      <div>
        <div class="day-label" id="day-label"></div>
        <div class="day-title" id="day-title"></div>
        <div class="task-count" id="task-count"></div>
      </div>
      <button class="btn btn-ghost" onclick="app.logout()" style="padding: 6px 12px; font-size: 12px;">Sair</button>
    </div>

    <div id="dashboard-container" class="dashboard-section"></div>

    <div class="add-form">
      <h3>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nova tarefa
      </h3>
      <div class="form-row">
        <div class="field">
          <label>Nome</label>
          <input type="text" id="f-name" placeholder="Título da tarefa..." />
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Descrição</label>
          <textarea id="f-desc" rows="2" placeholder="Detalhes opcionais..."></textarea>
        </div>
      </div>
      <div class="form-row two">
        <div class="field">
          <label>Status</label>
          <select id="f-status">
            <option value="PENDING">Pendente</option>
            <option value="IN_PROGRESS">Em andamento</option>
            <option value="DONE">Concluída</option>
          </select>
        </div>
        <div class="field">
          <label>Data</label>
          <input type="date" id="f-date" />
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="app.clearForm()">Limpar</button>
        <button class="btn btn-primary" id="save-btn" onclick="app.saveTask()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Salvar
        </button>
      </div>
    </div>

    <div class="filters-container">
      <div class="filters">
        <button class="filter-btn active" onclick="app.setFilter('ALL', this)">Todas</button>
        <button class="filter-btn" onclick="app.setFilter('PENDING', this)">Pendentes</button>
        <button class="filter-btn" onclick="app.setFilter('IN_PROGRESS', this)">Em andamento</button>
        <button class="filter-btn" onclick="app.setFilter('DONE', this)">Concluídas</button>
      </div>
      <div class="filters">
        <button class="filter-btn date-filter-btn active" onclick="app.setDateFilter('ALL', this)">Todo tempo</button>
        <button class="filter-btn date-filter-btn" onclick="app.setDateFilter('WEEK', this)">Esta Semana</button>
        <button class="filter-btn date-filter-btn" onclick="app.setDateFilter('MONTH', this)">Este Mês</button>
      </div>
    </div>

    <div id="tasks-container"></div>
  </section>

  <section id="admin-section" style="display: none;">
    <div class="day-header" style="display: flex; justify-content: space-between; align-items: center;">
      <div class="day-title">Painel Administrativo</div>
      <button class="btn btn-ghost" onclick="app.showTasksSection()" style="padding: 6px 12px; font-size: 12px;">Voltar às Tarefas</button>
    </div>
    
    <div class="add-form">
      <h3>Usuários Cadastrados</h3>
      <div id="admin-users-container"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script type="module" src="js/App.js"></script>
</body>
</html>
